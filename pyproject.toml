[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apnd"
version = "0.1.0"
description = "Third-Party Fraud & Corruption Network Detection - AP risk ranking using graph analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Versions are pinned to a floor and a major ceiling rather than left open. A
# model result that cannot be reproduced because a dependency moved underneath
# it is a validation finding, not an inconvenience.
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pandera>=0.19",
    "networkx>=3.2",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
graph   = ["neo4j>=5.18", "python-igraph>=0.11", "leidenalg>=0.10"]   # A7, A10
linkage = ["splink>=4.0"]                                            # A6
app     = ["streamlit>=1.33", "plotly>=5.20", "pyvis>=0.3"]          # A14
dev     = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "pre-commit>=3.7"]

[project.scripts]
apnd = "apnd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default argument - used deliberately for settings
    "BLE001", # broad except - used deliberately in health checks that must not raise
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "neo4j: tests that require a running Neo4j instance",
]

[tool.coverage.run]
source = ["src/apnd"]
omit = ["*/__init__.py"]